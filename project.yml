name: GoGhost
options:
  bundleIdPrefix: com.hxndrd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: R6PW26GDMS

packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios
    from: "5.14.0"

targets:
  GoGhost:
    type: application
    platform: iOS
    sources:
      - path: GoGhost
    resources:
      - path: GoGhost/Resources
    info:
      path: GoGhost/Info.plist
      properties:
        CFBundleDisplayName: 90DayRun
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        NSUserNotificationUsageDescription: "GoGhost sends daily check-in reminders."
        NSPhotoLibraryAddUsageDescription: "Save your run cards and weekly recaps to your photo library to share them."
        UIAppFonts:
          - BebasNeue-Regular.ttf
          - IBMPlexMono-Regular.otf
          - IBMPlexMono-Medium.otf
          - IBMPlexMono-SemiBold.otf
          - IBMPlexMono-Bold.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hxndrd.goghost
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: GoGhost/Info.plist
        CODE_SIGN_ENTITLEMENTS: GoGhost/GoGhost.entitlements
    scheme:
      testTargets:
        - GoGhostTests
        - GoGhostUITests
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework
      - package: RevenueCat
      - target: GoGhostWidget
        embed: true

  GoGhostWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GoGhostWidget
    info:
      path: GoGhostWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hxndrd.goghost.widget
        SWIFT_VERSION: "5.9"
        INFOPLIST_FILE: GoGhostWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: GoGhostWidget/GoGhostWidget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  GoGhostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoGhostTests
    dependencies:
      - target: GoGhost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hxndrd.goghost.tests
        GENERATE_INFOPLIST_FILE: YES

  GoGhostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: GoGhostUITests
    dependencies:
      - target: GoGhost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hxndrd.goghost.uitests
        GENERATE_INFOPLIST_FILE: YES
