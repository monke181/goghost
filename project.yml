name: GoGhost
options:
  bundleIdPrefix: com.hxndrd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_PREVIEWS: YES
    DEVELOPMENT_TEAM: R6PW26GDMS

targets:
  GoGhost:
    type: application
    platform: iOS
    sources:
      - path: GoGhost
    resources:
      - path: GoGhost/Resources
    info:
      path: GoGhost/Info.plist
      properties:
        CFBundleDisplayName: GoGhost
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UILaunchScreen: {}
        NSUserNotificationUsageDescription: "GoGhost sends daily check-in reminders."
        UIAppFonts:
          - BebasNeue-Regular.ttf
          - IBMPlexMono-Regular.otf
          - IBMPlexMono-Medium.otf
          - IBMPlexMono-SemiBold.otf
          - IBMPlexMono-Bold.otf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hxndrd.goghost
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: GoGhost/Info.plist
        CODE_SIGN_ENTITLEMENTS: GoGhost/GoGhost.entitlements
    scheme:
      testTargets:
        - GoGhostTests
    dependencies:
      - sdk: FamilyControls.framework
      - sdk: ManagedSettings.framework

  GoGhostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GoGhostTests
    dependencies:
      - target: GoGhost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hxndrd.goghost.tests
